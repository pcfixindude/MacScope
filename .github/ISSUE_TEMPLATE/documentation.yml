name: Documentation Improvement
description: Report unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Documentation area
      options:
        - README
        - User Guide
        - Developer Guide
        - Architecture
        - Contributing / Security / Code of Conduct
        - Roadmap / Changelog / Release checklist
        - Issue / PR templates
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Link or file path
      placeholder: docs/user-guide/USER_GUIDE.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who is affected?
      description: New users, contributors, release maintainers, etc.
